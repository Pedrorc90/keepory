spring:
  application:
    name: keepory-backend
  datasource:
    url: ${KEEPORY_DB_URL:jdbc:postgresql://localhost:5432/keepory}
    username: ${KEEPORY_DB_USER:keepory}
    password: ${KEEPORY_DB_PASSWORD:keepory}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    store-type: jdbc
    jdbc:
      # Flyway owns the SPRING_SESSION tables (V7).
      initialize-schema: never

server:
  port: 8080
  servlet:
    session:
      # Long-lived on purpose: this is a personal library, not a bank.
      timeout: 30d
      cookie:
        http-only: true
        # Lax is what makes disabling CSRF safe: a cross-site POST carries no cookie.
        same-site: lax

keepory:
  tmdb:
    api-key: ${TMDB_API_KEY:}
  google-books:
    api-key: ${GOOGLE_BOOKS_API_KEY:}
  rawg:
    api-key: ${RAWG_API_KEY:}
  admin:
    email: ${KEEPORY_ADMIN_EMAIL:}
    password: ${KEEPORY_ADMIN_PASSWORD:}
    display-name: ${KEEPORY_ADMIN_NAME:}
