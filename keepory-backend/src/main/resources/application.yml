spring:
  application:
    name: keepory-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/keepory
    username: keepory
    password: keepory
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

keepory:
  tmdb:
    api-key: ${TMDB_API_KEY:}
  google-books:
    api-key: ${GOOGLE_BOOKS_API_KEY:}
