services:
  - type: web
    name: keepory
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # sync: false means "Render asks for the value in the dashboard and keeps
      # it encrypted" — no secret ever lands in this file.
      - key: KEEPORY_DB_URL
        sync: false
      - key: KEEPORY_DB_USER
        sync: false
      - key: KEEPORY_DB_PASSWORD
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
